<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<title>Flowchart Studio — calc tests</title>
<style>
  body{font-family:'Segoe UI',sans-serif;background:#0C1726;color:#E5E7EB;padding:24px;margin:0}
  h1{font-size:16px;color:#fff;margin:0 0 12px}
  .sum{padding:10px 14px;border-radius:8px;font-size:13px;font-weight:700;margin-bottom:16px}
  .sum.ok{background:#065F46;color:#D1FAE5}
  .sum.fail{background:#7F1D1D;color:#FEE2E2}
  .case{padding:10px 14px;border-radius:6px;margin-bottom:6px;font-size:12px;font-family:'Consolas',monospace}
  .case.ok{background:#1F2937;color:#86EFAC}
  .case.fail{background:#3F1D1D;color:#FCA5A5}
  .case .det{display:block;font-size:11px;color:#94A3B8;margin-top:4px}
  .head{font-weight:700;color:#93C5FD;margin:14px 0 4px}
</style>
</head>
<body>
<h1>🧪 calc.js tests</h1>
<div id="sum" class="sum">Tests laden…</div>
<div id="out"></div>

<script src="../src/constants.js"></script>
<script src="../src/state.js"></script>
<script src="../src/utils.js"></script>
<script src="../src/calc.js"></script>
<script>
(function () {
  const results = [];
  let pass = 0, fail = 0;
  const out = document.getElementById('out');
  let currentGroup = '';

  function group(name) {
    currentGroup = name;
    const h = document.createElement('div');
    h.className = 'head';
    h.textContent = '▸ ' + name;
    out.appendChild(h);
  }

  function test(name, fn) {
    let err = null;
    try { fn(); } catch (e) { err = e; }
    const div = document.createElement('div');
    div.className = 'case ' + (err ? 'fail' : 'ok');
    div.textContent = (err ? '✗ ' : '✓ ') + name;
    if (err) {
      const det = document.createElement('span');
      det.className = 'det';
      det.textContent = (err.message || err) + (err.expected !== undefined
        ? `\n  verwacht: ${JSON.stringify(err.expected)}\n  gekregen: ${JSON.stringify(err.actual)}` : '');
      div.appendChild(det);
      fail++;
    } else {
      pass++;
    }
    out.appendChild(div);
  }

  function eq(actual, expected, msg) {
    if (actual !== expected) {
      const e = new Error(msg || 'eq mismatch');
      e.expected = expected; e.actual = actual;
      throw e;
    }
  }

  function close(actual, expected, eps, msg) {
    if (Math.abs(actual - expected) > (eps || 0.001)) {
      const e = new Error(msg || 'close mismatch');
      e.expected = expected; e.actual = actual;
      throw e;
    }
  }

  // Helper: zet een test-state op
  function setup(campaigns, fees) {
    FS.state.reset();
    FS.state.campaigns = campaigns || [];
    FS.state.fees = fees || {};
    FS.state.jaarTotal = 1000000;
    FS.state.budgetJournal = { base: 1000000, mods: [] };
    FS.state.creatieJournal = { mods: [] };
    FS.state.toolingJournal = { mods: [] };
    FS.state.urenJournal = { mods: [] };
    FS.state.settings = FS.state.defaultSettings();
    FS.state.feeTiers = FS.state.defaultFeeTiers();
  }

  function useExclCtc() {
    FS.state.settings.comm.inclCtc = false;
    FS.state.settings.comm.exclCtc = true;
  }

  function useTiers(scope, tiers, cap) {
    FS.state.feeTiers = {
      enabled: true,
      scope: scope || 'campaign',
      tiers: tiers.map((tier, index) => ({
        id: 'tier_' + index,
        upTo: tier.upTo,
        rate: tier.rate,
        channelRates: tier.channelRates || {},
      })),
      cap: cap || { enabled: false, above: 0, kind: 'amount', value: 0 },
    };
  }

  /* ============ flightBudget ============ */
  group('flightBudget');
  test('lege flight = 0', () => {
    eq(FS.calc.flightBudget({ tac: [] }), 0);
  });
  test('sommeert tactic-budgets', () => {
    eq(FS.calc.flightBudget({ tac: [{ b: 1000 }, { b: 2500 }] }), 3500);
  });
  test('negeert ontbrekende budgets', () => {
    eq(FS.calc.flightBudget({ tac: [{ b: 500 }, {}, { b: 200 }] }), 700);
  });

  /* ============ campaignTotal ============ */
  group('campaignTotal');
  test('losse campagne sommeert flights', () => {
    const c = { budget: 0, segs: [{ tac: [{ b: 1000 }] }, { tac: [{ b: 2000 }] }] };
    eq(FS.calc.campaignBudget(c), 3000);
  });
  test('vast campagne-budget overrult flight-som', () => {
    const c = { budget: 10000, segs: [{ tac: [{ b: 1000 }] }] };
    eq(FS.calc.campaignBudget(c), 10000);
  });

  /* ============ grandTotal ============ */
  group('grandTotal');
  test('lege state = 0', () => {
    setup([]);
    eq(FS.calc.grandTotal(), 0);
  });
  test('telt alle campagnes', () => {
    setup([
      { budget: 0, segs: [{ tac: [{ b: 1000 }] }] },
      { budget: 5000, segs: [{ tac: [{ b: 100 }] }] },
    ]);
    eq(FS.calc.grandTotal(), 6000);
  });

  /* ============ channelFee ============ */
  group('channelFee');
  test('zonder fee = 0', () => {
    setup([], {});
    eq(FS.calc.channelFee('FB', 1000), 0);
  });
  test('berekent fee = amount * rate/(1+rate)', () => {
    setup([], { FB: 0.1 });
    close(FS.calc.channelFee('FB', 1100), 100, 0.5);
  });

  /* ============ totalFee ============ */
  group('totalFee');
  test('zonder kanalen of fees = 0', () => {
    setup([{ budget: 0, segs: [{ tac: [{ b: 1000 }] }] }], {});
    eq(FS.calc.totalFee(), 0);
  });
  test('berekent fee per kanaal', () => {
    setup([{ budget: 0, segs: [{ tac: [{ b: 1100, ch: { FB: 1100 } }] }] }], { FB: 0.1 });
    close(FS.calc.totalFee(), 100, 0.5);
  });

  /* ============ handling-feestaffels ============ */
  group('handling-feestaffels');
  test('staffels uit behoudt vlakke kanaalfee', () => {
    setup([{ budget: 0, segs: [{ b: 1100, tac: [{ b: 1100, ch: { tv: 1100 } }] }] }], { tv: 0.1 });
    close(FS.calc.totalFee(), 100, 0.001);
    eq(FS.calc.feeBreakdown().enabled, false);
  });
  test('grens is inclusief en volgende staffel geldt over het hele bedrag', () => {
    setup([{ budget: 50000, segs: [{ b: 50000, tac: [{ b: 50000, ch: { tv: 50000 } }] }] }]);
    useExclCtc();
    useTiers('campaign', [{ upTo: 50000, rate: 0.1 }, { upTo: 100000, rate: 0.08 }]);
    close(FS.calc.totalFee(), 5000, 0.001);
    FS.state.campaigns[0].budget = 50001;
    close(FS.calc.totalFee(), 4000.08, 0.001);
  });
  test('dubbele en ongeldige grenzen worden veilig genegeerd', () => {
    setup([{ id: 1, budget: 50000, segs: [{ b: 50000, tac: [{ b: 50000, ch: { tv: 50000 } }] }] }]);
    useExclCtc();
    useTiers('campaign', [{ upTo: 50000, rate: 0.1 }, { upTo: 50000, rate: 0.2 }, { upTo: 100000, rate: 0.08 }]);
    close(FS.calc.totalFee(), 4000, 0.001);
  });
  test('lege rate blijft na normalisatie ongeldig en wordt geen 0%-staffel', () => {
    setup([{ id: 1, budget: 50000, segs: [{ b: 50000, tac: [{ b: 50000, ch: { tv: 50000 } }] }] }]);
    useExclCtc();
    FS.state.feeTiers = FS.state.mergeFeeTiers({
      enabled: true, scope: 'campaign',
      tiers: [{ id: 'invalid', upTo: 50000, rate: null, channelRates: {} }],
      cap: { enabled: false, above: 0, kind: 'amount', value: 0 },
    });
    eq(FS.state.feeTiers.tiers[0].rate, null);
    close(FS.calc.totalFee(), 0, 0.001);
    eq(FS.calc.feeBreakdown().scopes[0].tier, null);
  });
  test('ongeldige kanaalafwijking maakt de hele staffel ongeldig', () => {
    setup([{ id: 1, budget: 50000, segs: [{ b: 50000, tac: [{ b: 50000, ch: { tv: 50000 } }] }] }]);
    useExclCtc();
    useTiers('campaign', [{ upTo: 50000, rate: 0.1, channelRates: { tv: 1.5 } }]);
    close(FS.calc.totalFee(), 0, 0.001);
    eq(FS.calc.feeBreakdown().scopes[0].tier, null);
  });
  test('hoogste staffel loopt door boven de laatste grens', () => {
    setup([{ id: 1, budget: 120000, segs: [{ b: 120000, tac: [{ b: 120000, ch: { tv: 120000 } }] }] }]);
    useExclCtc();
    useTiers('campaign', [{ upTo: 50000, rate: 0.1 }, { upTo: 100000, rate: 0.08 }]);
    close(FS.calc.totalFee(), 9600, 0.001);
  });
  test('campagneniveau en flightniveau kiezen zelfstandig een staffel', () => {
    setup([{ id: 1, budget: 0, segs: [
      { b: 40000, tac: [{ b: 40000, ch: { tv: 40000 } }] },
      { b: 40000, tac: [{ b: 40000, ch: { tv: 40000 } }] },
    ] }]);
    useExclCtc();
    useTiers('campaign', [{ upTo: 50000, rate: 0.1 }, { upTo: 100000, rate: 0.08 }]);
    close(FS.calc.totalFee(), 6400, 0.001);
    FS.state.feeTiers.scope = 'flight';
    close(FS.calc.totalFee(), 8000, 0.001);
  });
  test('kanaalafwijking vervangt algemeen percentage en 0% blijft expliciet', () => {
    setup([{ id: 1, budget: 100000, segs: [{ b: 100000, tac: [
      { b: 60000, ch: { tv: 60000 } }, { b: 40000, ch: { social: 40000 } },
    ] }] }]);
    useExclCtc();
    useTiers('campaign', [{ upTo: 100000, rate: 0.1, channelRates: { tv: 0.05 } }]);
    close(FS.calc.totalFee(), 7000, 0.001);
    FS.state.feeTiers.tiers[0].channelRates.tv = 0;
    close(FS.calc.totalFee(), 4000, 0.001);
    const restored = FS.state.mergeFeeTiers(FS.state.feeTiers);
    eq(Object.prototype.hasOwnProperty.call(restored.tiers[0].channelRates, 'tv'), true);
    eq(restored.tiers[0].channelRates.tv, 0);
  });
  test('niet-toegewezen media gebruikt algemeen percentage', () => {
    setup([{ id: 1, budget: 0, segs: [{ b: 100000, tac: [{ b: 60000, ch: { tv: 60000 } }] }] }]);
    useExclCtc();
    useTiers('flight', [{ upTo: 100000, rate: 0.1, channelRates: { tv: 0.05 } }]);
    const info = FS.calc.feeBreakdown();
    close(info.baseTotal, 100000, 0.001);
    close(info.total, 7000, 0.001);
    close(info.components.filter((row) => row.unassigned).reduce((sum, row) => sum + row.amount, 0), 40000, 0.001);
  });
  test('kanaalbedragen boven scopebudget worden evenredig teruggeschaald', () => {
    setup([{ id: 1, budget: 0, segs: [{ b: 100000, tac: [{ b: 120000, ch: { tv: 120000 } }] }] }]);
    useExclCtc();
    useTiers('flight', [{ upTo: 100000, rate: 0.1, channelRates: { tv: 0.05 } }]);
    const info = FS.calc.feeBreakdown();
    close(info.baseTotal, 100000, 0.001);
    close(info.total, 5000, 0.001);
  });
  test('tactic-allocatie gebruikt dezelfde teruggeschaalde basis als de fee', () => {
    const tactic = { b: 60000, ch: { tv: 60000 } };
    const camp = { id: 1, budget: 100000, segs: [{ b: 100000, tac: [tactic, { b: 60000, ch: { social: 60000 } }] }] };
    setup([camp]);
    useExclCtc();
    useTiers('campaign', [{ upTo: 100000, rate: 0.1 }]);
    const allocation = FS.calc.allocationForTactic(camp, camp.segs[0], tactic);
    close(allocation.amount, 50000, 0.001);
    close(allocation.fee, 5000, 0.001);
  });
  test('incl. CTC gebruikt rate gedeeld door één plus rate', () => {
    setup([{ id: 1, budget: 110000, segs: [{ b: 110000, tac: [{ b: 110000, ch: { tv: 110000 } }] }] }]);
    useTiers('campaign', [{ upTo: 110000, rate: 0.1 }]);
    close(FS.calc.totalFee(), 10000, 0.001);
  });
  test('budgetBreakdown neemt staffelfee mode-correct mee in CTC en media', () => {
    setup([{ id: 1, budget: 100000, segs: [{ b: 100000, tac: [{ b: 100000, ch: { tv: 100000 } }] }] }]);
    useExclCtc();
    useTiers('campaign', [{ upTo: 100000, rate: 0.1 }]);
    let bd = FS.calc.budgetBreakdown();
    close(bd.media, 100000, 0.001);
    close(bd.fee, 10000, 0.001);
    close(bd.ctc, 110000, 0.001);
    FS.state.settings.comm.inclCtc = true;
    FS.state.settings.comm.exclCtc = false;
    bd = FS.calc.budgetBreakdown();
    close(bd.media, 90909.09, 0.01);
    close(bd.ctc, 100000, 0.001);
  });
  test('campagnepreview toont campagnestaffel en excl. CTC-opbouw', () => {
    const camp = { id: 1, budget: 80000, segs: [
      { b: 40000, tac: [{ b: 40000, ch: { tv: 40000 } }] },
      { b: 40000, tac: [{ b: 40000, ch: { tv: 40000 } }] },
    ] };
    setup([camp]);
    useExclCtc();
    useTiers('campaign', [{ upTo: 50000, rate: 0.1 }, { upTo: 100000, rate: 0.08 }]);
    const preview = FS.calc.entityFeePreview(camp);
    eq(preview.mode, 'excl');
    eq(preview.scope, 'campaign');
    eq(preview.tiers[0].index, 2);
    close(preview.selectionBasis, 80000, 0.001);
    close(preview.fee, 6400, 0.001);
    close(preview.media, 80000, 0.001);
    close(preview.ctc, 86400, 0.001);
  });
  test('flightpreview deelt campagnestaffel maar toont alleen flightfee', () => {
    const camp = { id: 1, budget: 80000, segs: [
      { b: 40000, tac: [{ b: 40000, ch: { tv: 40000 } }] },
      { b: 40000, tac: [{ b: 40000, ch: { tv: 40000 } }] },
    ] };
    setup([camp]);
    useExclCtc();
    useTiers('campaign', [{ upTo: 50000, rate: 0.1 }, { upTo: 100000, rate: 0.08 }]);
    const preview = FS.calc.entityFeePreview(camp, camp.segs[0]);
    eq(preview.tiers[0].index, 2);
    close(preview.selectionBasis, 80000, 0.001);
    close(preview.budget, 40000, 0.001);
    close(preview.fee, 3200, 0.001);
    close(preview.ctc, 43200, 0.001);
  });
  test('flightstaffels worden per flight gekozen en op campagne geaggregeerd', () => {
    const camp = { id: 1, budget: 0, segs: [
      { b: 40000, tac: [{ b: 40000, ch: { tv: 40000 } }] },
      { b: 60000, tac: [{ b: 60000, ch: { tv: 60000 } }] },
    ] };
    setup([camp]);
    useExclCtc();
    useTiers('flight', [{ upTo: 50000, rate: 0.1 }, { upTo: 100000, rate: 0.08 }]);
    const campaignPreview = FS.calc.entityFeePreview(camp);
    const firstFlightPreview = FS.calc.entityFeePreview(camp, camp.segs[0]);
    const secondFlightPreview = FS.calc.entityFeePreview(camp, camp.segs[1]);
    eq(campaignPreview.tiers.length, 2);
    eq(campaignPreview.tiers[0].index, 1);
    eq(campaignPreview.tiers[1].index, 2);
    close(campaignPreview.fee, 8800, 0.001);
    close(campaignPreview.ctc, 108800, 0.001);
    eq(firstFlightPreview.tiers[0].index, 1);
    close(firstFlightPreview.fee, 4000, 0.001);
    eq(secondFlightPreview.tiers[0].index, 2);
    close(secondFlightPreview.fee, 4800, 0.001);
  });
  test('entity-preview rekent incl. CTC terug naar netto media', () => {
    const camp = { id: 1, budget: 110000, segs: [{ b: 110000, tac: [{ b: 110000, ch: { tv: 110000 } }] }] };
    setup([camp]);
    useTiers('campaign', [{ upTo: 110000, rate: 0.1 }]);
    const preview = FS.calc.entityFeePreview(camp);
    eq(preview.mode, 'incl');
    close(preview.fee, 10000, 0.001);
    close(preview.media, 100000, 0.001);
    close(preview.ctc, 110000, 0.001);
  });
  test('vaste fee gebruikt campagne-placeholder als er geen tactics zijn', () => {
    const camp = { id: 1, budget: 50000, feePlaceholderChannel: 'tv', segs: [] };
    setup([camp], { tv: 0.1 });
    useExclCtc();
    const preview = FS.calc.entityFeePreview(camp);
    eq(preview.enabled, false);
    eq(preview.placeholderChannel, 'tv');
    eq(preview.placeholderSource, 'campaign');
    close(preview.fee, 5000, 0.001);
    close(preview.ctc, 55000, 0.001);
  });
  test('vaste placeholderfee rekent incl. CTC terug naar media', () => {
    const camp = { id: 1, budget: 110000, feePlaceholderChannel: 'tv', segs: [] };
    setup([camp], { tv: 0.1 });
    const preview = FS.calc.entityFeePreview(camp);
    eq(preview.mode, 'incl');
    close(preview.fee, 10000, 0.001);
    close(preview.media, 100000, 0.001);
    close(preview.ctc, 110000, 0.001);
  });
  test('flight-placeholder overschrijft campagne-placeholder bij vaste fees', () => {
    const flight = { b: 50000, feePlaceholderChannel: 'social', tac: [] };
    const camp = { id: 1, budget: 0, feePlaceholderChannel: 'tv', segs: [flight] };
    setup([camp], { tv: 0.1, social: 0.05 });
    useExclCtc();
    const preview = FS.calc.entityFeePreview(camp, flight);
    eq(preview.placeholderChannel, 'social');
    eq(preview.placeholderSource, 'flight');
    close(preview.fee, 2500, 0.001);
  });
  test('staffelplaceholder gebruikt kanaalafwijking zonder tactics', () => {
    const flight = { b: 80000, feePlaceholderChannel: 'tv', tac: [] };
    const camp = { id: 1, budget: 0, segs: [flight] };
    setup([camp]);
    useExclCtc();
    useTiers('flight', [{ upTo: 100000, rate: 0.08, channelRates: { tv: 0.05 } }]);
    const preview = FS.calc.entityFeePreview(camp, flight);
    eq(preview.tiers[0].index, 1);
    close(preview.channelRates.tv, 0.05, 0.001);
    close(preview.fee, 4000, 0.001);
  });
  test('echte tactic-kanalen blijven leidend boven placeholder', () => {
    const flight = { b: 80000, feePlaceholderChannel: 'tv', tac: [{ b: 80000, ch: { social: 80000 } }] };
    const camp = { id: 1, budget: 0, segs: [flight] };
    setup([camp], { tv: 0.1, social: 0.05 });
    useExclCtc();
    const preview = FS.calc.entityFeePreview(camp, flight);
    close(preview.fee, 4000, 0.001);
    eq(FS.calc.feeBreakdown().components.some((row) => row.unassigned), false);
  });
  test('placeholder vult alleen het niet-toegewezen restant', () => {
    const flight = { b: 80000, feePlaceholderChannel: 'tv', tac: [{ b: 40000, ch: { social: 40000 } }] };
    const camp = { id: 1, budget: 0, segs: [flight] };
    setup([camp], { tv: 0.1, social: 0.05 });
    useExclCtc();
    const preview = FS.calc.entityFeePreview(camp, flight);
    close(preview.fee, 6000, 0.001);
    const components = FS.calc.feeBreakdown().components;
    close(components.filter((row) => row.channelId === 'social').reduce((sum, row) => sum + row.amount, 0), 40000, 0.001);
    close(components.filter((row) => row.channelId === 'tv' && row.unassigned).reduce((sum, row) => sum + row.amount, 0), 40000, 0.001);
  });
  test('vast maximum is harde cap en start pas boven de drempel', () => {
    setup([{ id: 1, budget: 100000, segs: [{ b: 100000, tac: [{ b: 100000, ch: { tv: 100000 } }] }] }]);
    useExclCtc();
    useTiers('campaign', [{ upTo: 200000, rate: 0.1 }], { enabled: true, above: 100000, kind: 'amount', value: 5000 });
    close(FS.calc.totalFee(), 10000, 0.001);
    FS.state.campaigns[0].budget = 120000;
    close(FS.calc.totalFee(), 5000, 0.001);
    const capped = FS.calc.feeBreakdown();
    eq(capped.scopes[0].cap.applied, true);
    close(capped.components.reduce((sum, row) => sum + row.fee, 0), 5000, 0.001);
  });
  test('percentage-maximum volgt de CTC-richting', () => {
    setup([{ id: 1, budget: 120000, segs: [{ b: 120000, tac: [{ b: 120000, ch: { tv: 120000 } }] }] }]);
    useExclCtc();
    useTiers('campaign', [{ upTo: 200000, rate: 0.1 }], { enabled: true, above: 100000, kind: 'rate', value: 0.05 });
    close(FS.calc.totalFee(), 6000, 0.001);
  });
  test('ongeldig maximum wordt genegeerd en niet omgezet naar nul-cap', () => {
    setup([{ id: 1, budget: 120000, segs: [{ b: 120000, tac: [{ b: 120000, ch: { tv: 120000 } }] }] }]);
    useExclCtc();
    FS.state.feeTiers = FS.state.mergeFeeTiers({
      enabled: true, scope: 'campaign', tiers: [{ id: 'one', upTo: 200000, rate: 0.1, channelRates: {} }],
      cap: { enabled: true, above: 100000, kind: 'amount', value: null },
    });
    eq(FS.state.feeTiers.cap.value, null);
    close(FS.calc.totalFee(), 12000, 0.001);
  });
  test('gedeeltelijk actual wordt forecast; volledig actual wordt definitief', () => {
    setup([{ id: 1, budget: 0, segs: [
      { b: 40000, actualized: true, actualBudget: 20000, tac: [{ b: 40000, ch: { tv: 40000 } }] },
      { b: 40000, tac: [{ b: 40000, ch: { tv: 40000 } }] },
    ] }]);
    useExclCtc();
    useTiers('campaign', [{ upTo: 50000, rate: 0.1 }, { upTo: 100000, rate: 0.08 }]);
    let info = FS.calc.feeBreakdown();
    eq(info.status, 'forecast');
    close(info.baseTotal, 60000, 0.001);
    close(info.total, 4800, 0.001);
    FS.state.campaigns[0].segs[1].actualized = true;
    FS.state.campaigns[0].segs[1].actualBudget = 30000;
    info = FS.calc.feeBreakdown();
    eq(info.status, 'actual');
    close(info.baseTotal, 50000, 0.001);
    close(info.total, 5000, 0.001);
  });
  test('oude actualized flight zonder tactic-actuals valt terug op rato planned', () => {
    setup([{ id: 1, budget: 0, segs: [{ b: 100000, actualized: true, actualBudget: 50000, tac: [
      { b: 60000, ch: { tv: 60000 } }, { b: 40000, ch: { social: 40000 } },
    ] }] }]);
    useExclCtc();
    useTiers('flight', [{ upTo: 100000, rate: 0.1 }]);
    const info = FS.calc.feeBreakdown();
    close(info.baseTotal, 50000, 0.001);
    close(info.total, 5000, 0.001);
    close(info.components.filter((row) => row.channelId === 'tv').reduce((sum, row) => sum + row.amount, 0), 30000, 0.001);
  });
  test('inconsistente geïmporteerde actuals worden niet stil teruggeschaald', () => {
    setup([{ id: 1, budget: 0, segs: [{ b: 100000, actualized: true, actualBudget: 100000, tac: [
      { b: 60000, ch: { tv: 60000 }, actual: 80000 },
      { b: 40000, ch: { social: 40000 }, actual: 40000 },
    ] }] }]);
    useExclCtc();
    useTiers('flight', [{ upTo: 100000, rate: 0.1 }]);
    const info = FS.calc.feeBreakdown();
    close(info.total, 0, 0.001);
    eq(info.errors.length, 1);
    eq(info.components.length, 0);
  });

  /* ============ actualverdeling ============ */
  group('actualverdeling');
  test('handmatige actual blijft staan en restant wordt naar ontbrekende tactic verdeeld', () => {
    setup([]);
    const flight = { tac: [{ b: 60000, actual: 20000 }, { b: 40000 }] };
    const result = FS.calc.applyFlightActualDistribution(flight, 50000);
    eq(result.ok, true);
    close(flight.tac[0].actual, 20000, 0.001);
    close(flight.tac[1].actual, 30000, 0.001);
    eq(flight.tac[1].actualAuto, true);
  });
  test('expliciete actuals boven flighttotaal worden geweigerd', () => {
    setup([]);
    const result = FS.calc.planFlightActualDistribution({ tac: [{ b: 1, actual: 60 }, { b: 1, actual: 50 }] }, 100);
    eq(result.ok, false);
  });
  test('afronding over drie tactics sluit exact op centen', () => {
    setup([]);
    const flight = { tac: [{ b: 1 }, { b: 1 }, { b: 1 }] };
    const result = FS.calc.applyFlightActualDistribution(flight, 100);
    eq(result.ok, true);
    close(flight.tac.reduce((sum, tactic) => sum + tactic.actual, 0), 100, 0.0001);
    close(flight.tac[0].actual, 33.34, 0.0001);
  });
  test('creatie tooling en uren veranderen de staffelfee niet', () => {
    setup([{ id: 1, budget: 0, segs: [{ b: 50000, cb: 10000, tc: 20000, ub: 30000, tac: [{ b: 50000, ch: { tv: 50000 } }] }] }]);
    useExclCtc();
    useTiers('flight', [{ upTo: 50000, rate: 0.1 }]);
    const before = FS.calc.totalFee();
    FS.state.creatieJournal.mods.push({ a: 99999 });
    FS.state.toolingJournal.mods.push({ a: 99999 });
    FS.state.urenJournal.mods.push({ a: 99999 });
    close(FS.calc.totalFee(), before, 0.001);
    close(before, 5000, 0.001);
  });

  /* ============ budgetJaar ============ */
  group('budgetJaar / calcJaar');
  test('basis + mods', () => {
    setup([]);
    FS.state.budgetJournal = { base: 100000, mods: [{ a: 5000 }, { a: -2000 }] };
    FS.calc.calcJaar();
    eq(FS.state.jaarTotal, 103000);
  });

  /* ============ Klaar ============ */
  const sum = document.getElementById('sum');
  if (fail === 0) {
    sum.textContent = `✓ ${pass} tests geslaagd`;
    sum.className = 'sum ok';
  } else {
    sum.textContent = `✗ ${fail} mislukt · ${pass} geslaagd`;
    sum.className = 'sum fail';
  }
})();
</script>
